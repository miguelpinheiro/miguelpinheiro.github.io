<!DOCTYPE html>
<html>
<head>
    <title>Looped Vimeo Video</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }
        #video-container {
            width: 100%;
            height: 100vh;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div id="video-container">
        <iframe
            src="https://player.vimeo.com/video/1138181407?autoplay=1&loop=1&muted=1&title=0&byline=0&portrait=0&controls=0"
            allow="autoplay; fullscreen"
            allowfullscreen>
        </iframe>
    </div>
</body>
</html>
