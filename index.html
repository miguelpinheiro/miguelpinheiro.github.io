<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Mikes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
        }
        #video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -1;
        }
        .logo-container {
            margin-bottom: 50px;
            z-index: 1;
        }
        .logo-container img {
            max-width: 400px;
            height: auto;
        }
        .button-row {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .button {
            display: inline-block;
            padding: 30px 60px;
            margin: 0 20px;
            font-size: 36px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            color: white;
            background-color: #333333;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s;
            z-index: 1;
        }
        .button:hover {
            background-color: #555555;
        }
    </style>
</head>
<body>
    <video id="video-background" autoplay loop muted>
        <source src="bg.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="overlay"></div>

    <div class="logo-container">
        <img src="logo.png" alt="The Mikes Logo">
    </div>

    <div class="button-row">
        <a href="yt_loop.html" class="button">YouTube</a>
        <a href="vimeo.html" class="button">Vimeo</a>
    </div>
    <div class="button-row">
        <a href="promo.html" class="button">Promo</a>
        <a href="https://www.instagram.com/themikescoverband/" class="button" target="_blank">Instagram</a>
    </div>
</body>
</html>
